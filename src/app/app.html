@if (page() === 'login' || page() === 'create-account' || page() === 'forgot-password' || page() === 'email-verified') {
  <app-auth
    [page]="page()"
    [authMessage]="authMessage()"
    (loginSubmit)="login($event)"
    (createAccountSubmit)="createAccount($event)"
    (passwordResetSubmit)="requestPasswordReset($event)"
    (createAccountClick)="showCreateAccount($event)"
    (forgotPasswordClick)="showForgotPassword($event)"
    (loginClick)="showLogin($event)"
  />
} @else if (page() === 'dashboard') {
  <app-dashboard
    [playerStandings]="playerStandings"
    (teamSelectionClick)="showTeamSelection()"
    (logoutClick)="logout()"
    (playerClick)="showPlayerResults($event)"
  />
} @else if (page() === 'team-selection') {
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div class="dashboard-brand">
        <img src="logo-bet-arena.png" alt="Bet Arena logo" />
        <div>
          <p class="eyebrow">Sport prediction league</p>
          <!--h1>Timovi</h1-->
        </div>
      </div>
      <div class="dashboard-actions">
        <button class="logout-button dashboard-link-button" type="button" (click)="showDashboard()">Dashboard</button>
        <button class="logout-button logout-button--icon" type="button" aria-label="Logout" title="Logout" (click)="logout()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4h9v16h-9v-2h7V6h-7V4Zm1.7 4.3 1.4 1.4-2.3 2.3H21v2H10.8l2.3 2.3-1.4 1.4L7 13l4.7-4.7ZM3 4h4v2H5v12h2v2H3V4Z" />
          </svg>
        </button>
      </div>
    </header>

    <app-team-selection />
  </main>
} @else {
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div class="dashboard-brand">
        <img src="logo-bet-arena.png" alt=" Bet Arena logo" />
        <div>
          <p class="eyebrow">Sport prediction league</p>
          <h1>Rezultati</h1>
        </div>
      </div>
      <div class="dashboard-actions">
        <button class="logout-button dashboard-link-button" type="button" (click)="showDashboard()">Dashboard</button>
        <button class="logout-button logout-button--icon" type="button" aria-label="Logout" title="Logout" (click)="logout()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4h9v16h-9v-2h7V6h-7V4Zm1.7 4.3 1.4 1.4-2.3 2.3H21v2H10.8l2.3 2.3-1.4 1.4L7 13l4.7-4.7ZM3 4h4v2H5v12h2v2H3V4Z" />
          </svg>
        </button>
      </div>
    </header>

    <app-player-results [player]="selectedPlayer()" />
  </main>
}
